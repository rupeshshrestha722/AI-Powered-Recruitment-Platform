
spring.application.name=talentflow-backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/talentflow_db
spring.datasource.username=talentflow_user
spring.datasource.password=talentflow_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Configuration
app.jwt.issuer=talentflow-ai
app.jwt.expiration=3600000
app.jwt.secret=dGpRk2DZojJiNOIh3Fl0O3Bg9kYMlgS24o0xQa6gWbY

# Platform
app.bootstrap.platform-admin.enabled=false
app.bootstrap.platform-admin.first-name=Platform
app.bootstrap.platform-admin.last-name=Admin
app.bootstrap.platform-admin.email=platformAdmin@gmail.com
app.bootstrap.platform-admin.password=

# RustFS Object Storage
app.storage.endpoint=http://localhost:9000
app.storage.access-key=talentflow_admin
app.storage.secret-key=talentflow_rustfs_secret_2026
app.storage.bucket=talentflow-cvs
app.storage.region=us-east-1

# Spring AI - Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=2048
